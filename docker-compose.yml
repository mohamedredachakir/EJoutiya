services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: backend-php
    volumes:
      - "./backend:/var/www/html"
    working_dir: /var/www/html
    depends_on:
      - postgres
    networks:
      - localmind

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3535:80"
    volumes:
      - "./backend:/var/www/html"
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - backend
    networks:
      - localmind

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-react
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - nginx
    networks:
      - localmind

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ejoutiya_db}
      POSTGRES_USER: ${DB_USERNAME:-reddcs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reddcs}
    ports:
      - "2004:5432"
    volumes:
      - pgtables:/var/lib/postgresql/data
    networks:
      - localmind

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: reddcs@gmail.com
      PGADMIN_DEFAULT_PASSWORD: reddcs
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - localmind

  puml:
    image: plantuml/plantuml-server:jetty
    container_name: puml
    restart: always
    ports:
      - "4040:8080"
    volumes:
      - "./uml:/var/www/html/uml"

volumes:
  pgtables:

networks:
  localmind:
    driver: bridge
